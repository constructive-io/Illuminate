name: Release

# Publishes every public @wavegrid/* package to npm, so an operator installs a
# show with `npm i -g @wavegrid/cli` and never clones this repo.
#
# Versions are NOT bumped here — run `pnpm release:version` locally (lerna,
# independent versioning, conventional commits) and push the tags. This workflow
# publishes whatever versions the tagged commit holds; already-published
# versions are skipped, so re-running it is safe.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm -r --if-present run test

      # The gate that matters for a release: the tarballs we are about to push
      # must run a show on a machine with no checkout.
      - name: Verify a global install
        run: pnpm run verify:install

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
